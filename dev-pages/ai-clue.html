<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>새로 만든 부분 — AI 단서(물건이 바뀜)</title>
<style>*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#000}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.clue-new{position:fixed;top:8px;right:12px;margin:0;font-size:11px;letter-spacing:.02em;color:#555;z-index:30;background:#fff;padding:2px 6px;border:1px dashed #999}
#clue-app{max-width:1100px;margin:0 auto;padding:64px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.clue-dots{list-style:none;display:flex;gap:10px;margin:0;padding:0}
.clue-dots li{width:12px;height:12px;border:1.5px solid #000;border-radius:50%}
.clue-dots li.on{background:#000}
.clue-stage{position:relative;width:min(100%,calc(68vh * 16 / 9))}
.clue-frame{position:relative;width:100%;aspect-ratio:16/9;border:2px solid #000;overflow:hidden;cursor:crosshair;user-select:none;touch-action:manipulation;background:#fff}
.clue-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.clue-ghost{opacity:0;mix-blend-mode:multiply}
.clue-round{position:absolute;left:10px;bottom:8px;min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;border:1.5px solid #000;background:#fff;font:600 14px/1 ui-monospace,Consolas,monospace}
.clue-noise{position:absolute;inset:0;pointer-events:none;opacity:0;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
/* 바뀌는 순간: 같은 화면을 어긋나게 겹쳐 흔드는 글리치 */
.clue-frame.glitch .clue-noise{animation:clue-noise .42s steps(6) both}
.clue-frame.glitch #clue-ghost-a{animation:clue-shift-a .42s steps(5) both}
.clue-frame.glitch #clue-ghost-b{animation:clue-shift-b .42s steps(4) both}
.clue-frame.glitch #clue-img{animation:clue-flick .42s steps(3) both}
@keyframes clue-noise{0%{opacity:.9;transform:translateY(0)}50%{opacity:.6;transform:translateY(7px)}100%{opacity:0;transform:translateY(-4px)}}
@keyframes clue-shift-a{0%{opacity:.8;transform:translateX(-14px);clip-path:inset(10% 0 62% 0)}40%{opacity:.7;transform:translateX(18px);clip-path:inset(48% 0 30% 0)}80%{opacity:.6;transform:translateX(-6px);clip-path:inset(72% 0 8% 0)}100%{opacity:0;transform:none}}
@keyframes clue-shift-b{0%{opacity:.7;transform:translateX(10px);clip-path:inset(30% 0 50% 0)}50%{opacity:.6;transform:translateX(-22px);clip-path:inset(5% 0 80% 0)}100%{opacity:0;transform:none}}
@keyframes clue-flick{0%{filter:invert(1)}34%{filter:none}67%{filter:invert(1) contrast(2)}100%{filter:none}}
/* AI가 손댄 물건: 편집 프로그램처럼 선택 상자 + 손잡이 */
.clue-box{position:absolute;border:1.5px dashed #000;pointer-events:none;animation:clue-box-in .5s steps(4) both}
.clue-box i{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #000;transform:translate(-50%,-50%)}
.clue-box i:nth-child(1){left:0;top:0}.clue-box i:nth-child(2){left:50%;top:0}.clue-box i:nth-child(3){left:100%;top:0}.clue-box i:nth-child(4){left:100%;top:50%}
.clue-box i:nth-child(5){left:100%;top:100%}.clue-box i:nth-child(6){left:50%;top:100%}.clue-box i:nth-child(7){left:0;top:100%}.clue-box i:nth-child(8){left:0;top:50%}
.clue-box.hint{border-style:dotted;animation:clue-hint 1.1s ease-in-out infinite}
.clue-box.hint i{display:none}
@keyframes clue-box-in{0%{opacity:0;transform:scale(1.3)}50%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
@keyframes clue-hint{50%{opacity:.25}}
.clue-miss{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:1.5px solid #000;border-radius:50%;pointer-events:none;animation:clue-miss .45s ease-out both}
@keyframes clue-miss{from{opacity:.8;transform:scale(.4)}to{opacity:0;transform:scale(1.4)}}
/* AI 쪽지: 첫 화면 AI 쪽지와 같은 결 */
.clue-paper{position:absolute;right:4%;top:6%;max-width:min(380px,80%);word-break:keep-all;padding:18px 22px 14px;background:#fff;border:2px solid #000;border-radius:1% 2% 1% 3%/2% 1% 3% 1%;transform:rotate(-3deg);font-family:Batang,"바탕","Malgun Gothic",serif;animation:clue-paper .35s ease-out both}
.clue-paper p{margin:0;white-space:nowrap;font-size:clamp(17px,2.4vw,23px);line-height:1.45}
@keyframes clue-paper{from{opacity:0;transform:rotate(-8deg) translateY(-8px)}to{opacity:1;transform:rotate(-3deg)}}
.clue-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.clue-actions button{min-height:44px;padding:0 20px;border:2px solid #000;background:#fff;color:#000;font-family:inherit;font-size:16px;font-weight:600;line-height:1;cursor:pointer;border-radius:0}
.clue-actions button:hover{background:#000;color:#fff}
.clue-actions button:focus-visible{outline:2px solid #000;outline-offset:3px}
#clue-hint{border-style:dashed;font-weight:400}
.clue-final{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.clue-thumbs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clue-thumb{position:relative;aspect-ratio:16/9;border:1.5px solid #000;overflow:hidden}
.clue-thumb img{width:100%;height:100%;display:block}
.clue-thumb .clue-box{animation:none}
.clue-thumb .clue-box{border-width:1px}.clue-thumb .clue-box i{display:none}
.clue-who{margin:0;font-family:Batang,"바탕","Malgun Gothic",serif;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
.clue-who.glitch{animation:clue-who 1.6s steps(8) both}
@keyframes clue-who{0%{opacity:0;transform:translateX(-6px)}20%{opacity:1;transform:translateX(5px)}35%{transform:skewX(-14deg)}50%{transform:none;filter:invert(0)}70%{transform:translateX(-3px)}100%{opacity:1;transform:none}}
.clue-plan{margin-top:6px;font-size:12px;color:#333;padding:6px 10px;border:1px dashed #000}
.clue-plan b{display:inline-block;margin-right:6px;padding:1px 6px;background:#000;color:#fff;font-weight:700}
@media(max-width:640px){#clue-app{padding-top:58px}.clue-thumbs{grid-template-columns:1fr}.clue-paper{padding:10px 12px 8px}.clue-paper p{font-size:15px}}
@media(prefers-reduced-motion:reduce){.clue-frame.glitch *{animation:none!important}}
.clue-dots{order:0}.clue-stage,.clue-final{order:1}.clue-actions{order:2}.clue-plan{order:3}
@media(max-width:640px){.clue-box i{width:6px;height:6px;border-width:1px}}
.portable-back{position:fixed;top:max(16px,env(safe-area-inset-top));left:20px;width:44px;height:44px;display:grid;place-items:center;background:#fff;color:#000;text-decoration:none;z-index:20}.portable-back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5}.portable-back:focus-visible{outline:2px solid #000;outline-offset:4px}
</style></head>
<body>
<p id="clue-new" class="clue-new">새로 만든 부분: AI 단서(물건이 바뀜)</p>
<main id="clue-app" aria-label="AI 단서: 다시 들어가면 물건 하나가 바뀌어 있음">
  <ol id="clue-dots" class="clue-dots" aria-label="찾은 단서"><li></li><li></li><li></li></ol>
  <section id="clue-stage" class="clue-stage" aria-live="polite">
    <div id="clue-frame" class="clue-frame">
      <img id="clue-img" alt="" draggable="false">
      <img id="clue-ghost-a" class="clue-ghost" alt="" aria-hidden="true" draggable="false">
      <img id="clue-ghost-b" class="clue-ghost" alt="" aria-hidden="true" draggable="false">
      <span id="clue-round" class="clue-round">1</span>
      <div id="clue-box" class="clue-box" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="clue-miss" class="clue-miss" hidden></div>
      <div id="clue-noise" class="clue-noise" aria-hidden="true"></div>
    </div>
    <div id="clue-paper" class="clue-paper" hidden><p id="clue-line"></p></div>
  </section>
  <div class="clue-actions">
    <button id="clue-enter" type="button">다시 들어가기</button>
    <button id="clue-hint" type="button" hidden>못 찾겠어요</button>
    <button id="clue-next" type="button" hidden>다음 장소</button>
    <button id="clue-again" type="button" hidden>처음부터</button>
  </div>
  <section id="clue-final" class="clue-final" hidden aria-label="모은 단서">
    <div id="clue-thumbs" class="clue-thumbs"></div>
    <p id="clue-who" class="clue-who"></p>
  </section>
  <aside class="clue-plan" aria-label="본편 배치 예정"><b>구현 예정</b> 본편 2페이즈: 다시 들어간 곳마다 물건 하나가 바뀜 (짐 싸기 → 기억 → 미로)</aside>
</main>

<script>(() => {
  'use strict';
  // AI 단서: 다시 들어가면 물건 하나가 기계처럼 바뀌어 있다(10/21 손글씨 "물체가 달라지는 거 → AI가 여기 있었구나").
  // 그림은 실제 게임 화면 캡처(before)와 Codex가 ImageGen으로 만든 바뀐 판(after). build.cjs가 data URI로 넣음. 좌표는 1280×720 기준.
  const IMAGES = window.AIClueImages || {};
  const W = 1280, H = 720;
  const SCENES = [
    { id: 'suitcase', round: 2, line: '필요 없는 건 제가 지웠어요.', box: [244, 75, 47, 77] },
    { id: 'memory', round: 3, line: '제가 다시 그려 뒀어요.', box: [924, 76, 110, 105] },
    { id: 'maze', round: 4, line: '혼자면 외로우실까 봐요.', box: [538, 345, 63, 153] }
  ];
  const FINAL_LINE = '그런데… 당신 누구예요?';
  const $ = id => document.getElementById(id);
  const frame = $('clue-frame'), img = $('clue-img'), ghostA = $('clue-ghost-a'), ghostB = $('clue-ghost-b');
  const roundEl = $('clue-round'), box = $('clue-box'), miss = $('clue-miss'), paper = $('clue-paper'), line = $('clue-line');
  const enter = $('clue-enter'), hint = $('clue-hint'), next = $('clue-next'), again = $('clue-again');
  const dots = [...document.querySelectorAll('#clue-dots li')];
  const final = $('clue-final'), thumbs = $('clue-thumbs'), who = $('clue-who');
  let index = 0, state = 'before', hintTimer = 0;

  // box = Codex regions.json(바뀐 영역)에 8px 여유를 둔 값. 누름 판정은 30px 더 넓게(폰 터치).
  const src = (scene, kind) => IMAGES[kind + '-' + scene.id] || '';
  SCENES.forEach(scene => ['before', 'after'].forEach(kind => { const pre = new Image(); pre.src = src(scene, kind); }));

  let audio = null;
  function noise(duration = 0.38, volume = 0.05) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const length = Math.floor(audio.sampleRate * duration), buffer = audio.createBuffer(1, length, audio.sampleRate), data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length) * (i % 900 < 450 ? 1 : 0.3);
      const node = audio.createBufferSource(), gain = audio.createGain(), filter = audio.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 1400; filter.Q.value = 0.8;
      gain.gain.value = volume; node.buffer = buffer;
      node.connect(filter).connect(gain).connect(audio.destination); node.start();
    } catch (_) { /* 소리가 막힌 환경에서도 화면은 그대로 진행 */ }
  }
  function placeBox(target, scene) {
    const [x, y, w, h] = scene.box;
    Object.assign(target.style, { left: x / W * 100 + '%', top: y / H * 100 + '%', width: w / W * 100 + '%', height: h / H * 100 + '%' });
  }
  function show(kind) {
    const scene = SCENES[index];
    img.src = ghostA.src = ghostB.src = src(scene, kind);
    img.alt = kind === 'before' ? '처음 들어갔을 때의 장면' : '다시 들어갔을 때의 장면. 무언가 하나가 달라졌다';
  }
  function reset() {
    const scene = SCENES[index];
    state = 'before'; clearTimeout(hintTimer);
    show('before'); roundEl.textContent = '1';
    box.hidden = true; box.classList.remove('hint'); paper.hidden = true; final.hidden = true;
    frame.parentElement.hidden = false;
    enter.hidden = false; hint.hidden = next.hidden = again.hidden = true;
    enter.focus({ preventScroll: true });
    dots.forEach((dot, i) => dot.classList.toggle('on', i < index));
    frame.dataset.scene = scene.id;
  }
  function reenter() {
    if (state !== 'before') return;
    const scene = SCENES[index];
    state = 'search'; enter.hidden = true;
    frame.classList.remove('glitch'); void frame.offsetWidth; frame.classList.add('glitch');
    noise();
    setTimeout(() => { show('after'); roundEl.textContent = String(scene.round); }, 140);
    setTimeout(() => frame.classList.remove('glitch'), 460);
    hintTimer = setTimeout(() => { if (state === 'search') hint.hidden = false; }, 7000);
  }
  function found() {
    const scene = SCENES[index];
    state = 'found'; clearTimeout(hintTimer); hint.hidden = true;
    box.classList.remove('hint'); placeBox(box, scene); box.hidden = false;
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    noise(0.18, 0.035);
    // 쪽지는 바뀐 물건을 가리지 않게 반대쪽에 붙인다
    const [bx, by, bw, bh] = scene.box, left = bx + bw / 2 > W / 2, low = by + bh / 2 < H / 2;
    Object.assign(paper.style, { left: left ? '4%' : 'auto', right: left ? 'auto' : '4%', top: low ? 'auto' : '6%', bottom: low ? '10%' : 'auto' });
    setTimeout(() => { line.textContent = scene.line; paper.hidden = false; }, 520);
    dots[index].classList.add('on');
    setTimeout(() => { next.textContent = index < SCENES.length - 1 ? "다음 장소" : "모아 보기"; next.hidden = false; next.focus({ preventScroll: true }); }, 1500);
  }
  function finish() {
    frame.parentElement.hidden = true; next.hidden = true;
    thumbs.replaceChildren(...SCENES.map(scene => {
      const card = document.createElement('div'); card.className = 'clue-thumb';
      const pic = document.createElement('img'); pic.src = src(scene, 'after'); pic.alt = '';
      const mark = document.createElement('div'); mark.className = 'clue-box'; placeBox(mark, scene);
      mark.innerHTML = '<i></i>'.repeat(8);
      card.append(pic, mark); return card;
    }));
    final.hidden = false; who.textContent = '';
    setTimeout(() => { who.textContent = FINAL_LINE; who.classList.remove('glitch'); void who.offsetWidth; who.classList.add('glitch'); noise(0.6, 0.06); }, 900);
    setTimeout(() => { again.hidden = false; }, 2400);
  }
  frame.addEventListener('click', event => {
    if (state === 'before') { reenter(); return; }
    if (state !== 'search') return;
    const rect = frame.getBoundingClientRect(), scene = SCENES[index];
    const x = (event.clientX - rect.left) / rect.width * W, y = (event.clientY - rect.top) / rect.height * H;
    const [bx, by, bw, bh] = scene.box, pad = 30;
    if (x >= bx - pad && x <= bx + bw + pad && y >= by - pad && y <= by + bh + pad) { found(); return; }
    miss.hidden = false; miss.style.left = (x / W * 100) + '%'; miss.style.top = (y / H * 100) + '%';
    miss.style.animation = 'none'; void miss.offsetWidth; miss.style.animation = '';
  });
  enter.addEventListener('click', reenter);
  hint.addEventListener('click', () => { const scene = SCENES[index]; placeBox(box, scene); box.classList.add('hint'); box.hidden = false; hint.hidden = true; });
  next.addEventListener('click', () => { if (index < SCENES.length - 1) { index++; reset(); } else finish(); });
  again.addEventListener('click', () => { index = 0; who.classList.remove('glitch'); reset(); });
  window.AIClueDev = { scenes: SCENES, go(i) { index = Math.max(0, Math.min(SCENES.length - 1, i)); reset(); }, reenter, found, finish };
  reset();
})();
</script>
