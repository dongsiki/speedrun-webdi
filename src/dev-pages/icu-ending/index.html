<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>중환자실 컷신 — 개발자용</title>
<link rel="stylesheet" href="icu-ending.css">
</head>
<body>
<div class="new-tag">새로 만든 부분: 중환자실 컷신</div>

<section id="start" class="screen">
  <p class="where">전체 클리어 뒤 · 컷신</p>
  <button id="play" type="button">컷신 보기</button>
  <a class="back" href="../../../02_speedrun_dev.html">개발자 목록으로</a>
</section>

<section id="scene" class="screen" hidden>
  <div class="frame">
    <img id="shot-a" class="shot" alt="">
    <img id="shot-b" class="shot" alt="">
    <canvas id="breath" aria-hidden="true"></canvas>
    <div class="grain"></div>
    <div id="veil" class="veil"></div>
  </div>
  <p id="line" class="line" aria-live="polite"></p>
  <p id="keys" class="keys" hidden></p>
  <button id="skip" class="skip" type="button">건너뛰기</button>
</section>

<section id="end" class="screen" hidden>
  <p class="end-mark">끝</p>
  <button id="again" type="button">한 번 더</button>
  <a class="back" href="../../../02_speedrun_dev.html">개발자 목록으로</a>
</section>

<audio id="voice" preload="auto"></audio>
<script src="icu-ending.js"></script>
</body>
</html>
