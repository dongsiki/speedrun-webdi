<!-- 개발자용 새 항목(src/dev-pages/voice-narration): 음성 내레이션·놀리는 음성 (2026-10-26 Claude Code).
     본편(01)과 같은 게임을 그대로 쓰고 앞에 세 가지만 끼운다.
     1) 기록 칸 분리: 저장 기록에 'devnew-voice:' 이름표를 붙여 01의 기록을 읽거나 덮지 않는다.
     2) voice.js: 화면에 뜨는 대사를 보고 같은 문장의 F1 음성을 작게 튼다.
     3) 왼쪽 위 작은 표시와 '음성' 패널(바로가기·대사 듣기·끄기). -->
<script>
(() => {
  const prefix = 'devnew-voice:';
  try {
    const proto = Storage.prototype, get = proto.getItem, set = proto.setItem, remove = proto.removeItem;
    const own = store => store === window.localStorage;
    proto.getItem = function (key) { return get.call(this, own(this) ? prefix + key : key); };
    proto.setItem = function (key, value) { return set.call(this, own(this) ? prefix + key : key, value); };
    proto.removeItem = function (key) { return remove.call(this, own(this) ? prefix + key : key); };
  } catch (_) {}
})();
</script>

</style>
